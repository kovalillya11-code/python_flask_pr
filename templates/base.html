<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - Mandry</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='../static/css/style.css') }}">
    
</head>
<body>
    <header class="main-header">
        <div class="logo">Mandry</div>
        <nav class="main-nav">
            <a href="{{ url_for('index') }}">Головна</a>
            <a href="{{ url_for('about') }}">Про нас</a>
            <a href="{{ url_for('tours') }}">Тури</a>
            <a href="{{ url_for('gallery') }}">Галерея</a>
            <a href="{{ url_for('contacts') }}">Контакти</a>
        </nav>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
